<li id="{{id}}" class="faq-item" data-cat="{{category}}">
        <h3><button type="button" class="faq-q" id="{{questionId}}" aria-expanded="false" aria-controls="{{answerId}}"><span class="faq-qa">Q</span><span class="faq-qt" data-text="{{question}}">{{question}}</span><span class="faq-arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"></path></svg></span></button></h3>
        <div class="faq-a" id="{{answerId}}" role="region" aria-labelledby="{{questionId}}"><div><span class="faq-qa">A</span><div class="faq-at">{{{answerHtml}}}</div></div></div>
      </li>

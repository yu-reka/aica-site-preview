<div class="bx9-s" id="{{id}}" role="tabpanel" aria-labelledby="bx9t-1-0">
              <div class="bx9-ph" tabindex="0" aria-roledescription="사진 넘김" aria-label="{{galleryLabel}}">
                <div class="bx9-tr">
                  <div class="{{view.panel.photos.0.className}}" role="img" aria-label="{{photos.0.alt}}"></div>
                  <div class="{{view.panel.photos.1.className}}" role="img" aria-label="{{photos.1.alt}}"></div>
                  <div class="{{view.panel.photos.2.className}}" role="img" aria-label="{{photos.2.alt}}"></div>
                </div>
                <span class="bx-ex">사진 예시</span>
                <button type="button" class="bx9-a prev" aria-label="이전 사진">‹</button>
                <button type="button" class="bx9-a next" aria-label="다음 사진">›</button>
                <p class="bx9-cap"><span>{{caption}}</span><span class="bx9-n"><b>1</b> / 3</span></p>
              </div>
              <div class="bx9-foot">
                <div class="bx9-info"><h4>{{name}}</h4><ul><li>{{notes.0}}</li><li>{{notes.1}}</li></ul></div>
                <div class="bx9-th" role="group" aria-label="정문(입구) 사진 고르기">
                  <button type="button" class="{{view.panel.photos.0.thumbnailClass}}" aria-label="{{photos.0.thumbnailLabel}}" aria-current="true"></button>
                  <button type="button" class="{{view.panel.photos.1.thumbnailClass}}" aria-label="{{photos.1.thumbnailLabel}}"></button>
                  <button type="button" class="{{view.panel.photos.2.thumbnailClass}}" aria-label="{{photos.2.thumbnailLabel}}"></button>
                </div>
              </div>
            </div>

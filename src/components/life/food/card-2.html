<li class="fdc" data-t="{{type}}" data-g="{{group}}" data-w="{{walkMinutes}}">
            <div class="fdc-ph has-img" role="img" aria-label="{{photoLabel}}" data-field="photo"><img src="{{image}}" alt="" loading="lazy">
              <span class="fdc-cat" data-field="category">{{category}}</span>

            </div>
            <div class="fdc-b">
              <div class="fdc-gw"><p class="{{view.card.groupClass}}">{{groupLabel}}</p><span class="fdc-wk" data-field="walk">{{walkLabel}}</span></div>
              <h3 data-field="name">{{name}}</h3>
              <p class="fdc-m" data-field="menu" data-menu="{{menu}}" data-neighborhood="{{neighborhood}}">{{menu}} · {{neighborhood}}</p>
            </div>
          </li>

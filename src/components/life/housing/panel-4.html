<section class="hzp" id="{{panelId}}" role="tabpanel" aria-labelledby="hzt-4" data-i="{{index}}" hidden>
                <div class="hzc-h"><b data-field="name">{{name}}</b><span class="hzc-area">{{area}}</span></div>
                <p class="hzc-s" data-field="summary">{{summary}}</p>
                <dl>
                  <div class="hzc-cnt"><dt>원룸 건물 수</dt><dd data-field="density">{{{densityHtml}}}</dd></div>
                  <div><dt>주로 보이는 형태</dt><dd data-field="type">{{{typeHtml}}}</dd></div>
                  <div class="hzc-gs"><dt>고시원</dt><dd data-field="gosiwon">{{{gosiwonHtml}}}</dd></div>
                  <div class="hzc-rent"><dt>원룸 월세(매물 글 기준)</dt><dd data-field="rent">{{{rentHtml}}}</dd></div>
                </dl>
              </section>

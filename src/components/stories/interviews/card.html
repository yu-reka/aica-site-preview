<a class="iv" href="#{{id}}">
              <div class="ph"><img class="illu" src="{{thumbnail}}" alt="{{thumbnailAlt}}" loading="lazy" decoding="async" width="880" height="550" data-field="thumbnail"></div>
              <div class="tb">
                <h3 data-field="title">{{title}}</h3>
                <blockquote class="ivq">{{quote}}</blockquote>
                <p data-field="summary">{{summary}}</p>
                <div class="by"><span class="av" data-field="cohort">{{cohort}}<i>기</i></span><b data-field="author">{{author}}</b><em data-field="track">{{track}}</em></div>
              </div>
            </a>

<div class="{{view.detail.className}}" id="{{id}}" style="{{view.detail.style}}" role="dialog" aria-modal="true" aria-labelledby="{{id}}-t">
  <a class="back" href="#p-rev" aria-label="닫기"></a>
  <div class="sheet">
    <a class="x" href="#p-rev" aria-label="닫기"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 6 12 12M18 6 6 18"/></svg></a>
    <div class="mscroll">
      <div class="mtop"><div class="mcat" data-field="category">{{category}}</div><h3 id="{{id}}-t" data-field="title">{{title}}</h3>
        <div class="mby"><span class="mav" data-field="cohort">{{cohort}}<i>기</i></span><div><b data-field="author">{{author}}</b><em data-field="track">{{track}}</em></div></div>
      </div>
      <div class="mbody">
        <p class="lead" data-field="summary">{{summary}}</p>
        {{{bodyHtml}}}
        <div class="mtags">{{#each tags}}{{> stories/reviews/tag}}{{/each}}<span class="hint">태그를 누르면 창이 닫히고 그 태그의 후기만 모여요</span></div>
      </div>
    </div>
  </div>
</div>

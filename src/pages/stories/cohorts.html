<!doctype html>
<html lang="ko" data-menu="stories" data-sub="cohorts" data-nav="side" data-theme="light">
<head>
  <script src="../common/js/public-content.js"></script>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="only light">
  <title>기수별 이모저모 — 선배들의 이야기 — 인공지능사관학교</title>
  <meta name="description" content="입교식부터 수료식까지, 기수마다 있었던 일을 모아 봅니다.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="기수별 이모저모 — 선배들의 이야기 — 인공지능사관학교">
  <meta property="og:description" content="입교식부터 수료식까지, 기수마다 있었던 일을 모아 봅니다.">
{{> stories/head-base}}
  <link rel="stylesheet" href="css/stories.css?v={{v.stories.css.stories}}">
  <link rel="stylesheet" href="css/stories-sections.css">
{{> stories/head-presentation}}
  <link rel="stylesheet" href="css/cohort-v3.css?v={{v.stories.css.cohort-v3.cohorts}}">
  <link rel="stylesheet" href="css/stories-m.css?v={{v.stories.css.stories-m.cohorts}}">
  <link rel="stylesheet" href="../common/css/components.css?v={{v.common.css.components}}">
<link rel="stylesheet" href="../common/css/navigation-mobile.css?v={{v.common.css.navigation-mobile}}">
  <script src="js/cohort-v3.js?v={{v.stories.js.cohort-v3}}" defer></script>
  <script src="js/cohort-modal-scroll.js?v={{v.stories.js.cohort-modal-scroll}}" defer></script>
{{> stories/head-scripts}}
  <script src="js/stories-m.js?v={{v.stories.js.stories-m}}" defer></script>
  <script src="js/cohort-month-navigation.js?v={{v.stories.js.cohort-month-navigation}}" defer></script>
  <script src="js/stories.js?v={{v.stories.js.stories}}" defer></script>
</head>
<body>
<header class="site-header" id="siteHeader"></header>
<!-- 본문: 디자이너 시안 '선배들의이야기_최신'(2026-10-08) → 2026-10-13 한 페이지 탭을 2뎁스별 페이지로 나눔(사용자 요청: 한눈에 보기 + 하위 메뉴마다 페이지).
     stories/index.html = 한눈에 보기(각 2뎁스 요약 + 전체 보기) · reviews.html = 후기 · interviews.html = 인터뷰 · projects.html = 프로젝트 · cohorts.html = 기수별 이모저모
     각 페이지는 옛 탭 라디오(t1~t4) 중 자기 것만 checked — CSS(stories.css .pane)와 js/stories.js가 그대로 동작. 다른 페이지 글 주소는 그 페이지.html#글id로 고쳐 둠
     반복 단위(첫 항목에만 data-field 표시, 나머지는 같은 구조): 후기 카드 .idc · 후기 리스트 행 .rvr · 글 창 .ov · 인터뷰 카드 .iv · 인터뷰 상세 .ivd · 프로젝트 .pp · 기수 카드 a.st
     칸 이름: title · summary · body · category · cohort · tag · thumbnail · author · date(common 게시판과 같음) + track · duration · question · answer · team · type -->
<main id="main" class="stories-page" tabindex="-1">
<h1 class="sr">기수별 이모저모 — 선배들의 이야기</h1>   <!-- 10-13 사본: 나눈 페이지 제목(화면엔 안 보임, 원본 h1.sr과 같은 방식) -->
{{> stories/masthead-2}}
<input class="tr tb" autocomplete="off" type="radio" name="tab" id="t1" tabindex="-1" aria-hidden="true">
<input class="tr tb" autocomplete="off" type="radio" name="tab" id="t2" tabindex="-1" aria-hidden="true">
<input class="tr tb" autocomplete="off" type="radio" name="tab" id="t3" tabindex="-1" aria-hidden="true">
<input class="tr tb" autocomplete="off" type="radio" name="tab" id="t4" checked tabindex="-1" aria-hidden="true">
<span class="tgt2" id="go-iv"></span>
<span class="tgt2" id="go-pr"></span>
<span class="tgt2" id="go-coh"></span>
<div class="st-main">
  <section class="wrap pane" id="p-coh">
    <div class="sh sh-row">
      <div><p class="sh-k">기수별 이모저모</p><h2>입교식부터 수료식까지, 기수마다 이런 일이 있었어요</h2></div>
    </div>
    <div data-story-list-state hidden></div>
    <div class="cv3" id="cv3">
      <div class="cv3-chips" role="group" aria-label="기수 고르기"></div>
      <div class="cv3-ig">
        <div class="cv3-prof"></div>
        <div class="cv3-diff" hidden></div>
        <div class="cv3-hl" role="group" aria-label="달별로 보기"></div>
        <p class="cv3-gt"></p>
        <div class="cv3-grid"></div>
        <div data-cohort-filter-empty hidden></div>
      </div>
      <nav class="cv3-pg" aria-label="기수 기록 페이지"></nav>
      <!-- 기수 정보(2026-10-22): 기수마다 교육과정 카드 · 계정 이름 · 꼬리표 · '이전 기수와 달라진 점' 버튼 이름 · 소개 · 달라진 점 표는
           백오피스 관리자 '기수 정보' 화면(DB cohort_infos)에서 관리해요. js/cohort-v3.js가 STORIES_DATA.cohortInfos(공개 API · stories-data.js)로 받아 고른 기수에 보여 줘요.
           기수 칩은 게시중인 글이 있는 기수만 보여요(기수 정보만 있는 기수는 칩 없음). 글을 못 불러오면 이 화면 대신 페이지 오류 화면만 보여 줘요.
           새 기수 글을 처음 게시하면 백오피스가 앞 기수 모양으로 그 기수 정보를 만들어요(내용은 '기수 정보' 화면에서 채움) -->
      <template id="cv3-data">
{{#each stories.cohorts}}{{> @view.card.template}}
{{/each}}
      </template>
    </div>
  </section>
</div>
{{> stories/cohort-dialog}}
</div>
</main>
<footer class="site-footer" id="siteFooter" data-note="본 사이트는 카테고리·콘텐츠 구성안을 확인하기 위한 시안이며, 표시된 수치·일정·혜택은 모두 더미 데이터입니다."></footer>
</body>
</html>
